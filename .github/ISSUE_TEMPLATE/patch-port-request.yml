name: Script / config fix request
description: Report a broken script, integration, or configuration that needs a fix
labels: ["bug", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to report a script, integration, or config file that is
        broken or producing incorrect results.

  - type: input
    id: file
    attributes:
      label: Affected file
      placeholder: "e.g. scripts/bdfs-dev-btrfs.sh or integrations/ostree/bdfs-ostree.sh"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What is broken
      description: Describe the incorrect behaviour or failure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell

  - type: checkboxes
    id: willing-to-fix
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a fix PR
